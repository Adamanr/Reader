[package]
name = "reader"
version = "0.1.0"
description = "Local-first e-book reader and personal library manager"
authors = ["Adamanr"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Adamanr/Reader"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
base64 = "0.22.1"
dirs = "6.0.0"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", rev = "e7730ae3e00a5427b9d90f06ee6d2e985b63f8c1" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git", rev = "e7730ae3e00a5427b9d90f06ee6d2e985b63f8c1", features = ["serde"] }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git", rev = "e7730ae3e00a5427b9d90f06ee6d2e985b63f8c1" }
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust", "apple-native", "windows-native"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
tantivy = "0.26.2"
pdf-extract = "0.12.1"
encoding_rs = "0.8.42"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
